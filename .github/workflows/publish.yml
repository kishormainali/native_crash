name: Publish to pub.dev

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'      # v1.0.0
      - 'v[0-9]+.[0-9]+.[0-9]+-*'    # v1.0.0-beta.1  (pre-releases)

jobs:
  # ── 1. Verify tests pass before publishing ──────────────────────────────────
  test:
    name: Verify tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test

  # ── 2. Verify the tag version matches pubspec.yaml ──────────────────────────
  validate-version:
    name: Validate version
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check tag matches pubspec version
        run: |
          TAG="${GITHUB_REF_NAME}"          # e.g. v1.0.0
          PUBSPEC_VERSION="v$(grep '^version:' pubspec.yaml | awk '{print $2}')"
          echo "Tag:              $TAG"
          echo "pubspec version:  $PUBSPEC_VERSION"
          if [ "$TAG" != "$PUBSPEC_VERSION" ]; then
            echo "❌  Tag ($TAG) does not match pubspec.yaml version ($PUBSPEC_VERSION)"
            exit 1
          fi
          echo "✅  Versions match"

  # ── 3. Publish using OIDC (no stored credentials) ───────────────────────────
  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest
    needs: validate-version

    # Must match the environment name configured under:
    #   pub.dev package admin → Automated publishing → GitHub Actions
    environment: pub.dev

    permissions:
      id-token: write   # Required for OIDC token exchange with pub.dev
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Provisions the OIDC token pub.dev needs: it requests a GitHub-signed ID
      # token for https://pub.dev, exports it as PUB_TOKEN and registers it with
      # `dart pub token add`. Without this step `dart pub publish` finds no
      # credentials and asks for an interactive login. It must run BEFORE the
      # Flutter step: the `dart` binary from the Flutter SDK below shadows this
      # one (needed to publish Flutter packages), but reuses the token.
      - name: Set up Dart and pub.dev OIDC token
        uses: dart-lang/setup-dart@v1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Tooling run during setup can touch tracked files (e.g. example/
      # analysis_options.yaml), which makes pub warn about a dirty git state and
      # exit 65. Show what changed, then restore the checked-out state.
      - name: Ensure clean git state
        run: |
          git status --short
          git diff
          git checkout -- .

      - name: Publish - dry run
        run: dart pub publish --dry-run

      - name: Publish
        run: dart pub publish --force

  # ── 4. Create a GitHub Release for the tag ──────────────────────────────────
  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: publish   # Only release a tag that actually published successfully

    permissions:
      contents: write   # Required to create a release via GITHUB_TOKEN

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Pulls this version's own section out of CHANGELOG.md (between its
      # "## x.y.z" heading and the next one) so the GitHub Release body
      # matches the changelog instead of GitHub's auto-generated commit list.
      - name: Extract release notes from CHANGELOG.md
        id: notes
        run: |
          VERSION="${GITHUB_REF_NAME#v}"   # v1.1.0 -> 1.1.0
          awk -v ver="$VERSION" '
            /^## / {
              if (found) exit
              if ($2 == ver || index($0, "[" ver "]") > 0) { found=1; next }
              next
            }
            found { print }
          ' CHANGELOG.md | sed '/^---$/d' > release_notes.md

          if [ ! -s release_notes.md ]; then
            echo "_No CHANGELOG.md entry found for $VERSION._" > release_notes.md
          fi

          echo "Extracted notes for $VERSION:"
          cat release_notes.md

      - name: Create release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          name: ${{ github.ref_name }}
          body_path: release_notes.md
          # The workflow's own tag patterns treat anything with a `-` (e.g.
          # v1.1.0-beta.1) as a pre-release; mark the GitHub Release the same way.
          prerelease: ${{ contains(github.ref_name, '-') }}
